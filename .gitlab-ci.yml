# GitLab CI for vauchi-website
#
# Landing page + app-files content hosting
#
# GitLab Ultimate Features:
#   - Secret Detection: Prevent credential leaks
#   - Container Scanning: Docker image vulnerability scanning
#   - SAST: Static code analysis (JS security)
#   - Dependency Scanning: npm vulnerability detection

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  interruptible: true

# GitLab Ultimate Templates
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.11
    file:
      - '/ci-templates/reuse.yml'
      - '/ci-templates/image-lint.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.11"
  VAUCHI_THEMES_REF: "215da2f699ad6ef8354cefb71f9e88fa8062e6bd"
  CS_IMAGE: "registry.gitlab.com/vauchi/website:$CI_COMMIT_SHA"

stages:
  - lint
  - test
  - build
  - scan
  - deploy

lint:images:
  extends: .image-lint

# Lint HTML files
lint:html:
  stage: lint
  tags:
    - self-hosted
    - node
  needs: []
  before_script:
    - pip3 install --break-system-packages --quiet jinja2 2>/dev/null
      || pip3 install --quiet jinja2
    - python3 scripts/build-pages.py
  script:
    - htmlhint --rulesdir scripts/htmlhint-svg-tag-pair.js public/**/*.html
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "templates/**/*"
        - "i18n/**/*"
        - "public/**/*.html"
    - if: $CI_COMMIT_BRANCH == "main"

# Cross-cutting docker lint checks
lint:cross-cutting-blocking:
  stage: lint
  tags: [docker]
  needs: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/nginx:1.27-alpine
  before_script:
    - apk add --no-cache python3 py3-jsonschema
  script:
    - cp nginx.conf /etc/nginx/conf.d/default.conf
    - nginx -t
    - python3 scripts/validate-content.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - nginx.conf
        - Dockerfile
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - app-files-src/**/*
        - scripts/**/*
    - if: $CI_COMMIT_BRANCH == "main"

# E2E tests — theme toggle & language switching
# Uses node:22-bookworm (~300MB) instead of playwright:noble (~2.3GB).
# Installs only chromium via playwright install --with-deps.
test:e2e:
  stage: test
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-bookworm
  needs: []
  before_script:
    - npm ci
    - npx playwright install --with-deps chromium
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip > /dev/null
    - pip3 install --break-system-packages --quiet jinja2
    - python3 scripts/build-pages.py
    - curl -fsSL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz
      | tar -xz -C /usr/local/bin
    - zola --root blog build --output-dir public/blog
      --base-url http://localhost:3000/blog
    - mkdir -p public/app-files/themes
    - curl -fsSL "https://gitlab.com/api/v4/projects/vauchi%2Fthemes/repository/files/themes.json/raw?ref=${VAUCHI_THEMES_REF}"
      -o public/app-files/themes/themes.json
  script:
    - npx playwright test
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/results.xml
    expire_in: 3 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "templates/**/*"
        - "i18n/**/*"
        - "public/**/*"
        - "tests/**/*"
        - "blog/**/*"
        - "playwright.config.js"
        - "scripts/build-pages.py"
    - if: $CI_COMMIT_BRANCH == "main"

# Build app-files manifest and output
build:content:
  stage: build
  tags: [docker]
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - python scripts/build-manifest.py --version "${CONTENT_VERSION:-1.0.0}"
      --base-url "https://cdn.vauchi.app/v1/"
  artifacts:
    paths:
      - public/app-files/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - app-files-src/**/*
        - scripts/**/*
    - if: $CI_COMMIT_BRANCH == "main"

# Sign content manifest with Ed25519 (main only)
sign:content:
  stage: build
  tags: [docker]
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  needs: ["build:content"]
  before_script:
    - uv pip install --system --quiet PyNaCl
  script:
    - |
      if [ -z "${CONTENT_SIGNING_KEY:-}" ]; then
        echo "CONTENT_SIGNING_KEY not set — skipping signing"
        exit 0
      fi
    - echo "$CONTENT_SIGNING_KEY" > /tmp/signing.key
    - python scripts/sign-manifest.py --manifest public/app-files/manifest.json
      --private-key /tmp/signing.key
    - rm -f /tmp/signing.key
  artifacts:
    paths:
      - public/app-files/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Build and push docker image
#
# On MRs: builds the image to validate the Dockerfile (local tag only).
# On main: builds and pushes to GitLab Container Registry.
#
# Note: CI_REGISTRY_IMAGE may be empty if the project container registry
# is not enabled, so we fall back to a local tag for validation builds.
build:docker:
  stage: build
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27
  services:
    - ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - IMAGE="${CI_REGISTRY_IMAGE:-vauchi-website}"
    - >-
      printf '{"sha":"%s","short_sha":"%s","ref":"%s","built":"%s","pipeline":"%s"}\n'
      "$CI_COMMIT_SHA" "$CI_COMMIT_SHORT_SHA" "$CI_COMMIT_REF_NAME"
      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$CI_PIPELINE_URL"
      > public/build-info.json
    - cat public/build-info.json
    # Embed themes.json as local fallback (CDN is primary source at runtime)
    - mkdir -p public/app-files/themes
    - >-
      curl -fsSL
      "https://gitlab.com/api/v4/projects/vauchi%2Fthemes/repository/files/themes.json/raw?ref=${VAUCHI_THEMES_REF}"
      -o public/app-files/themes/themes.json
      || echo "WARN: themes.json fetch failed — CDN will be sole source"
    # --pull forces a fresh base-image fetch on every build so upstream
    # Alpine/zlib/etc. security patches land in the next image.
    - docker build --pull -t $IMAGE:$CI_COMMIT_SHA -t $IMAGE:latest .
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ] && [ -n "$CI_REGISTRY_IMAGE" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
        docker push $IMAGE:$CI_COMMIT_SHA
        # Re-tag from the SHA image before pushing :latest — under dind,
        # the second -t of a BuildKit build is intermittently missing at
        # push time ('tag does not exist', 2026-07-09 cdn + 2026-07-10 main).
        docker tag $IMAGE:$CI_COMMIT_SHA $IMAGE:latest
        docker push $IMAGE:latest
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Security scanning overrides — pin to docker runner, make blocking
gemnasium-dependency_scanning:
  tags: [docker]
  allow_failure: false

# The template auto-generates this python variant WITHOUT tags; untagged
# jobs wait forever when no untagged-accepting runner is online and the
# pending test stage blocks build+deploy (2026-07-10: main stuck 30min).
gemnasium-python-dependency_scanning:
  tags: [docker]

secret_detection:
  tags: [docker]
  allow_failure: false

semgrep-sast:
  tags: [docker]
  allow_failure: false

# Container vulnerability scanning (overrides GitLab template)
container_scanning:
  stage: scan
  tags: [docker]
  needs: ["build:docker"]
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Smoke test against deployed site
test:e2e:deployed:
  stage: deploy
  tags: [docker]
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  needs: []
  when: manual
  before_script:
    - npm ci
  script:
    - BASE_URL=https://vauchi.app npx playwright test
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/results.xml
    expire_in: 3 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# Deploy website to production via _private pipeline
# Auto-triggers the centralized deploy pipeline in _private.
# The _private pipeline has manual gate jobs — click "play" there.

deploy:trigger:
  stage: deploy
  needs:
    - job: build:docker
  trigger:
    project: vauchi/private
    branch: main
  variables:
    DEPLOY_SERVICE: landing
    DEPLOY_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build and push CDN Docker image (content baked in)
build:cdn-docker:
  stage: build
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27
  services:
    - ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
  needs:
    - job: sign:content
      optional: true
    - job: build:content
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - CDN_IMAGE="${CI_REGISTRY_IMAGE}/cdn"
    # --pull mirrors the main site build — pick up upstream base-image patches.
    - docker build --pull -f cdn/Dockerfile -t $CDN_IMAGE:$CI_COMMIT_SHA -t $CDN_IMAGE:latest .
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ] && [ -n "$CI_REGISTRY_IMAGE" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
        docker push $CDN_IMAGE:$CI_COMMIT_SHA
        # Same dind tag-visibility race guard as build:docker above.
        docker tag $CDN_IMAGE:$CI_COMMIT_SHA $CDN_IMAGE:latest
        docker push $CDN_IMAGE:latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Deploy CDN to production via _private pipeline (same as landing)
deploy:cdn:
  stage: deploy
  needs:
    - job: build:cdn-docker
  trigger:
    project: vauchi/private
    branch: main
  variables:
    DEPLOY_SERVICE: cdn
    DEPLOY_IMAGE: "$CI_REGISTRY_IMAGE/cdn:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
