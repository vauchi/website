version = 1
SPDX-PackageName = "vauchi-website"
SPDX-PackageSupplier = "Mattia Egloff <mattia.egloff@pm.me>"

# License files
[[annotations]]
path = ["LICENSES/**"]
SPDX-FileCopyrightText = "Free Software Foundation"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Lock files
[[annotations]]
path = ["**/Cargo.lock", "**/package-lock.json", "**/yarn.lock", "**/*.lock"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Git and editor config files
[[annotations]]
path = [".gitignore", "**/.gitignore", ".DS_Store", "**/.gitkeep", ".dockerignore", ".htmlhintrc"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# JSON config files
[[annotations]]
path = ["**/*.json"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Binary/media files
[[annotations]]
path = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.ico", "**/*.svg", "**/*.webp"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Font files
[[annotations]]
path = ["**/*.ttf", "**/*.otf", "**/*.woff", "**/*.woff2", "**/*.eot"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Build artifacts and cache
[[annotations]]
path = ["**/gradle-wrapper.jar", "**/gradlew", "**/gradlew.bat"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Xcode project files
[[annotations]]
path = ["**/*.pbxproj", "**/*.xcworkspacedata", "**/contents.xcworkspacedata"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Android resource files
[[annotations]]
path = ["**/*.webp"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Docker and server config
[[annotations]]
path = ["Dockerfile", "**/*.conf", "nginx.conf"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Python scripts
[[annotations]]
path = ["**/*.py"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Blog articles — prose, shared under CC-BY-4.0. No inline headers:
# Zola requires the +++ front matter to be the first bytes of the file.
[[annotations]]
path = ["blog/content/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "CC-BY-4.0"

# Blog Tera templates — child templates must start with {% extends %}
# (Tera rejects content before it) and reuse misparses SPDX tags inside
# Tera comments, so licensing is declared here instead of inline.
[[annotations]]
path = ["blog/templates/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Claude Code project instructions
[[annotations]]
path = ["**/CLAUDE.md"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Standard web files (robots.txt, sitemap.xml, ads.txt, security.txt)
[[annotations]]
path = ["**/*.txt", "**/*.xml"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"
