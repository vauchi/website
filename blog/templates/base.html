<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta
      name="description"
      content="{% block description %}{{ config.description }}{% endblock description %}"
    />
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="{{ config.title }}"
      href="{{ get_url(path='atom.xml', trailing_slash=false) }}"
    />
    {% block extra_head %}{% endblock extra_head %}
    <style>
      /* Palette and fonts mirror the landing page (templates/index.html).
         CSP allows inline styles only (style-src 'unsafe-inline'), so all
         CSS lives here. Dark is the default, as on the landing page. */
      :root {
        --bg-primary: #1e1e2e;
        --bg-secondary: #181825;
        --bg-tertiary: #313244;
        --text-primary: #cdd6f4;
        --text-secondary: #a6adc8;
        --accent: #89b4fa;
        --accent-dark: #74c7ec;
        --border: #45475a;
        --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          sans-serif;
        --mono: "SF Mono", "Fira Code", Consolas, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-primary: #eff1f5;
          --bg-secondary: #e6e9ef;
          --bg-tertiary: #ccd0da;
          --text-primary: #4c4f69;
          --text-secondary: #6c6f85;
          --accent: #1e66f5;
          --accent-dark: #209fb5;
          --border: #bcc0cc;
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--sans);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.7;
        font-size: 1.05rem;
      }
      .wrap {
        max-width: 44rem;
        margin: 0 auto;
        padding: 0 20px;
      }
      header.site {
        border-bottom: 1px solid var(--border);
        padding: 18px 0;
        margin-bottom: 40px;
      }
      header.site .wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      header.site img {
        width: 28px;
        height: 28px;
      }
      header.site .brand {
        font-weight: 600;
        color: var(--text-primary);
        text-decoration: none;
        font-size: 1.1rem;
      }
      header.site nav {
        margin-left: auto;
        display: flex;
        gap: 16px;
        font-size: 0.9rem;
      }
      header.site nav a {
        color: var(--text-secondary);
        text-decoration: none;
      }
      header.site nav a:hover {
        color: var(--accent);
      }
      main {
        min-height: 60vh;
        padding-bottom: 40px;
      }
      h1 {
        font-size: 1.9rem;
        line-height: 1.25;
        margin-bottom: 8px;
      }
      h2 {
        font-size: 1.35rem;
        margin: 36px 0 12px;
      }
      h3 {
        font-size: 1.1rem;
        margin: 28px 0 10px;
      }
      p,
      ul,
      ol {
        margin-bottom: 18px;
      }
      ul,
      ol {
        padding-left: 24px;
      }
      li {
        margin-bottom: 6px;
      }
      a {
        color: var(--accent);
      }
      a:hover {
        color: var(--accent-dark);
      }
      blockquote {
        border-left: 3px solid var(--border);
        padding-left: 16px;
        color: var(--text-secondary);
        margin-bottom: 18px;
      }
      code {
        font-family: var(--mono);
        font-size: 0.9em;
        background: var(--bg-tertiary);
        border-radius: 4px;
        padding: 1px 5px;
      }
      pre {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        overflow-x: auto;
        margin-bottom: 18px;
      }
      pre code {
        background: none;
        padding: 0;
      }
      hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 32px 0;
      }
      .meta {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 28px;
      }
      .post-list {
        list-style: none;
        padding: 0;
      }
      .post-list li {
        margin-bottom: 28px;
      }
      .post-list .date {
        color: var(--text-secondary);
        font-size: 0.85rem;
        display: block;
      }
      .post-list a.post-title {
        font-size: 1.25rem;
        font-weight: 600;
        text-decoration: none;
      }
      .post-list p {
        margin: 4px 0 0;
        color: var(--text-secondary);
        font-size: 0.95rem;
      }
      footer.site {
        border-top: 1px solid var(--border);
        padding: 24px 0 40px;
        color: var(--text-secondary);
        font-size: 0.85rem;
      }
      footer.site .wrap {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      footer.site a {
        color: var(--text-secondary);
      }
      footer.site a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <img src="/logo.webp" alt="" width="28" height="28" />
        <a class="brand" href="/">Vauchi</a>
        <nav>
          <a href="/blog/">Blog</a>
          <a href="https://vauchi.app/docs">Docs</a>
          <a href="/#waitlist">Get early access</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="wrap">{% block content %}{% endblock content %}</div>
    </main>
    <footer class="site">
      <div class="wrap">
        <span>© 2026 Mattia Egloff</span>
        <span>Articles licensed
          <a
            href="https://creativecommons.org/licenses/by/4.0/"
            rel="license noopener"
            >CC BY 4.0</a
          ></span
        >
        <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}"
          >Atom feed</a
        >
        <a href="https://gitlab.com/vauchi" rel="noopener">GitLab</a>
      </div>
    </footer>
  </body>
</html>
