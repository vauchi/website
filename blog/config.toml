# Zola configuration for the Vauchi blog, served at vauchi.app/blog.
# Built into public/blog/ by the Dockerfile build stage (prod) and by
# the test:e2e CI job (local base_url override for Playwright).

base_url = "https://vauchi.app/blog"
title = "Vauchi Blog"
description = "Essays on contact-layer privacy, portable identity, and building outside the platforms."
default_language = "en"

generate_feeds = true
feed_filenames = ["atom.xml"]

compile_sass = false
build_search_index = false

[markdown]
smart_punctuation = true
external_links_target_blank = true
