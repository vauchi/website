; Waitlist API supervisor program fragment. Loaded via the [include]
; in metrics-collector/supervisord.conf — new fragments must be added
; there too, or supervisord silently ignores them.

[program:waitlist]
command=gunicorn -w 2 -b 127.0.0.1:8081 --access-logfile - --error-logfile - --timeout 30 api:app
directory=/app/waitlist
user=nginx
autostart=true
autorestart=true
stdout_logfile=/var/log/vauchi/waitlist.log
stderr_logfile=/var/log/vauchi/waitlist.log
