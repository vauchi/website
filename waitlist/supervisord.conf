; Waitlist API supervisor program fragment.
; This file is loaded alongside /etc/supervisor/conf.d/supervisord.conf.

[program:waitlist]
command=gunicorn -w 2 -b 127.0.0.1:8081 --access-logfile - --error-logfile - --timeout 30 api:app
directory=/app/waitlist
user=nginx
autostart=true
autorestart=true
stdout_logfile=/var/log/vauchi/waitlist.log
stderr_logfile=/var/log/vauchi/waitlist.log
