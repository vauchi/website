<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ t['waitlist.heading'] }} · Vauchi</title>
    <style>
      html { color-scheme: light dark; }
      body { max-width: 60ch; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.7; }
      h1 { line-height: 1.3; }
      nav a { display: block; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ t['waitlist.heading'] }}</h1>
      <p role="status">{{ t['waitlist.message.' ~ result] }}</p>
      <nav>
        <a href="{{ text_home }}">{{ t['footer.text_version'] }}</a>
        <a href="{{ home }}">{{ t['waitlist.manage.back'] }}</a>
      </nav>
    </main>
  </body>
</html>
