# typos spell checker configuration for website repo
#
# Non-English locale files (de, fr, es, it) contain correct foreign words
# that the English spell checker flags as typos. We disable typos checking
# for all locale JSON files and rely on the validation script
# (scripts/validate.py --strict) for locale quality instead.

[files]
extend-exclude = ["public/index.html", "public/de/", "public/fr/", "public/it/"]

[type.json]
check-file = false

[default]
# Bitcoin bech32/bech32m and Monero base58 addresses are random strings
# that would otherwise read as typos (vauchi/private#1307).
extend-ignore-re = [
  "(?i)\\b(bc|tb|sp|tsp)1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{6,}\\b",
  "\\b[48][1-9A-HJ-NP-Za-km-z]{94}\\b",
]

[default.extend-words]
# Correct French/German address label used in localization regression tests.
Adresse = "Adresse"
# German formal "you", which the locale test forbids in de.json.
Sie = "Sie"

[type.schema-license]
extend-glob = ["CC-BY-SA-3.0.txt"]
[type.schema-license.extend-words]
# Verbatim SPDX license text: https://spdx.org/licenses/CC-BY-SA-3.0.html
MERCHANTIBILITY = "MERCHANTIBILITY"
