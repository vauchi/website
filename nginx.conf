# Website requests must not become a per-visitor access event stream.
access_log off;

# Empty keys keep removal links usable during mail-request throttling.
map $uri $waitlist_mail_client {
    default "";
    /waitlist/join $binary_remote_addr;
    /waitlist/manage $binary_remote_addr;
}
limit_req_zone $waitlist_mail_client zone=waitlist:10m rate=5r/m;

server {
    # default_server is load-bearing: the docs.vauchi.app redirect block
    # below adds a second server_name, and kamal-proxy health checks
    # arrive with a Host matching neither. Without this they would land on
    # whichever block nginx picked first and start 301-ing to /docs.
    listen 80 default_server;
    server_name vauchi.app www.vauchi.app;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://cdn.vauchi.app; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json;

    # Redirects to docs site
    location ~ ^/(privacy(\.html)?|(legal/)?privacy-policy)/?$ {
        return 301 https://vauchi.app/docs/legal/privacy-policy.html;
    }

    # Old cached scripts can still send beacons after a new page deploys.
    # Retire their endpoint as well as removing collection from new clients.
    location /beacon {
        return 410;
    }

    # Waitlist API (same-origin, served by the internal Flask app)
    location /waitlist/ {
        limit_req zone=waitlist burst=3 nodelay;
        # Nginx request errors include client IPs and token-bearing URLs.
        # Service health remains visible through probes and fixed app errors.
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Extensionless, so it would inherit application/octet-stream from the
    # base mime map; FLOSS/fund fetches this as the manifest ownership proof
    location = /.well-known/funding-manifest-urls {
        default_type text/plain;
    }

    # Extensionless like the above; Apple fetches it directly from the
    # apps' CDN and requires application/json with no redirect
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # Exchange-link landing (vauchi/private#277). Served in place, never
    # redirected: the exchange travels in the URL fragment, which must stay
    # in the browser.
    location = /x {
        try_files /x/index.html =404;
    }

    # Sveltia CMS (vauchi/private#822) talks to the GitLab API from the
    # browser and does not support Trusted Types, so it gets its own policy;
    # the rest of the site keeps the strict one. ^~ keeps the asset regex
    # locations below from matching here. add_header in a location drops
    # the server-level headers, so all of them are repeated. Its update
    # check (unpkg) and web fonts (jsdelivr) stay blocked on purpose: the
    # admin makes no third-party requests and falls back to system fonts.
    location ^~ /blog/admin/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gitlab.com https://secure.gravatar.com; font-src 'self' data:; connect-src 'self' data: https://gitlab.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # The GitLab login popup comes back here from gitlab.com and posts
        # the token through window.opener; any other COOP value severs the
        # opener on that cross-origin return and the login loops.
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/index.html =404;
    }

    # Serve files, locale dirs, then 404 (not SPA fallback to index.html)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Cache static assets — fonts and images are truly immutable
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JS/CSS/JSON change with deployments — short TTL with revalidation
    location ~* \.(js|css|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# The docs moved from the docs.vauchi.app subdomain to vauchi.app/docs in
# 2026-08: Google treats a subdomain as a separate site, so the old layout
# could never consolidate into a single search result.
#
# This redirect is permanent, not a migration window. External links,
# search-engine records, and anything printed or archived will keep asking
# for the old host indefinitely; $request_uri preserves the path so
# docs.vauchi.app/developers/threat-model.html lands on its new home
# rather than dumping every visitor at the docs index.
server {
    listen 80;
    server_name docs.vauchi.app;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://vauchi.app/docs$request_uri;
}
