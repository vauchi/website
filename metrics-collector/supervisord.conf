[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/var/log/supervisor/supervisord.log

; supervisord loads ONLY the -c file; fragments in conf.d are ignored
; without an explicit include. Named file, not *.conf — a glob would
; re-include this file and fail on the duplicate [supervisord] section.
[include]
files = /etc/supervisor/conf.d/waitlist.conf

[program:metrics-collector]
command=python3 /app/collector.py
autostart=true
autorestart=true
stdout_logfile=/var/log/vauchi/collector.log
stderr_logfile=/var/log/vauchi/collector.log

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/var/log/vauchi/nginx.log
stderr_logfile=/var/log/vauchi/nginx.log
